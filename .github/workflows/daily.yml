name: Daily job list

# Target ~9:00 PM IST. GitHub's free scheduler is best-effort and often runs
# 5-30 min LATE, so we schedule at 15:00 UTC (8:30 PM IST) as a buffer — a
# typical delay then lands the email around 9:00 PM. It can still drift; for an
# exact 9:00 PM send, use the macOS launchd option in the README instead.
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Scan and email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m job_scanner.main
